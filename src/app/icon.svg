<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F9B8E"/><stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- hub: one central node linked to four smaller nodes (fleet master) -->
  <g stroke="#FFFFFF" stroke-width="64" stroke-linecap="round">
    <line x1="512" y1="512" x2="270" y2="270"/>
    <line x1="512" y1="512" x2="754" y2="270"/>
    <line x1="512" y1="512" x2="270" y2="754"/>
    <line x1="512" y1="512" x2="754" y2="754"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="270" cy="270" r="96"/>
    <circle cx="754" cy="270" r="96"/>
    <circle cx="270" cy="754" r="96"/>
    <circle cx="754" cy="754" r="96"/>
    <circle cx="512" cy="512" r="170"/>
  </g>
</svg>
